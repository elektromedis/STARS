# ============================================================
# STARS - docker-compose (Tahap 3)
# Satu berkas yang sama dipakai untuk beberapa lokasi:
#   1. Server intranet RS : `docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build`
#                           akses http://<ip-server>:3000 ; STARS_MODE=intranet (operator mengunggah di sini)
#   2. Server internet    : tambah `--profile internet` → layanan caddy memberi HTTPS otomatis
#                           STARS_MODE=internet (baca saja, menerima `npm run sync` dari intranet)
#   3. Server cloud (VPS)  : satu-satunya server, STARS_MODE=intranet, APP_PORT=127.0.0.1:3000 + Tailscale Funnel.
#                           Dipasang & dirawat oleh deploy/pasang-vps.sh (lewat deploy\vps.bat) - lihat docs/PINDAH-KE-CLOUD.md
#
# Basis data: SQLite di volume `stars_data` (cukup untuk skala RS; cadangan lewat Admin → Sistem).
# Salin deploy/.env.example → deploy/.env lalu isi nilainya SEBELUM up.
# ============================================================
name: stars

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/stars.db
      UPLOAD_DIR: /app/uploads
      AUTH_SECRET: ${AUTH_SECRET:?isi AUTH_SECRET di deploy/.env}
      # AUTH_URL sengaja TIDAK diisi: STARS dibuka dari beberapa alamat sekaligus (localhost, IP LAN,
      # https Tailscale/domain). Alamat diambil dari header permintaan (AUTH_TRUST_HOST).
      AUTH_TRUST_HOST: "true"
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?isi SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?isi SUPERADMIN_PASSWORD}
      SUPERADMIN_NAMA: ${SUPERADMIN_NAMA:-Super Admin STARS}
      STARS_MODE: ${STARS_MODE:-intranet}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      STARS_URL_PUBLIK: ${STARS_URL_PUBLIK:-}
    volumes:
      - stars_data:/app/data
      - stars_uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"

  # Hanya server internet: reverse proxy + sertifikat HTTPS otomatis (Let's Encrypt).
  caddy:
    image: caddy:2-alpine
    profiles: ["internet"]
    restart: unless-stopped
    environment:
      STARS_DOMAIN: ${STARS_DOMAIN:?isi STARS_DOMAIN untuk profil internet}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  stars_data:
  stars_uploads:
  caddy_data:
  caddy_config:

# ============================================================
# STARS - docker-compose (Tahap 3)
# Satu berkas yang sama dipakai untuk beberapa lokasi:
#   1. Server intranet RS : `docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build`
#                           akses http://<ip-server>:3000 ; STARS_MODE=intranet (operator mengunggah di sini)
#   2. Server internet    : tambah `--profile internet` → layanan caddy memberi HTTPS otomatis
#                           STARS_MODE=internet (baca saja, menerima `npm run sync` dari intranet)
#   3. Server cloud (VPS)  : satu-satunya server, STARS_MODE=intranet, APP_PORT=127.0.0.1:3000 + Tailscale Funnel.
#                           Dipasang & dirawat oleh deploy/pasang-vps.sh (lewat deploy\vps.bat) - lihat docs/PINDAH-KE-CLOUD.md
#
# Basis data: SQLite di volume `stars_data` (cukup untuk skala RS; cadangan lewat Admin → Sistem).
# Salin deploy/.env.example → deploy/.env lalu isi nilainya SEBELUM up.
# ============================================================
name: stars

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/stars.db
      UPLOAD_DIR: /app/uploads
      AUTH_SECRET: ${AUTH_SECRET:?isi AUTH_SECRET di deploy/.env}
      # AUTH_URL sengaja TIDAK diisi: STARS dibuka dari beberapa alamat sekaligus (localhost, IP LAN,
      # https Tailscale/domain). Alamat diambil dari header permintaan (AUTH_TRUST_HOST).
      AUTH_TRUST_HOST: "true"
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?isi SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?isi SUPERADMIN_PASSWORD}
      SUPERADMIN_NAMA: ${SUPERADMIN_NAMA:-Super Admin STARS}
      STARS_MODE: ${STARS_MODE:-intranet}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      STARS_URL_PUBLIK: ${STARS_URL_PUBLIK:-}
      TRILUX_URL: ${TRILUX_URL:-}
      IMMS_HOST: ${IMMS_DOMAIN:-}
      # Bridging SMART MFK (token sama di kedua aplikasi; kosong = API integrasi nonaktif)
      INTEGRASI_TOKEN: ${INTEGRASI_TOKEN:-}
      SMARTMFK_URL: ${SMARTMFK_URL:-}
      SMARTMFK_URL_PUBLIK: ${SMARTMFK_URL_PUBLIK:-}
      # ALLIES AI: kosong = mesin lokal; profil "ai" mengisi http://ollama:11434
      ALLIES_LLM_URL: ${ALLIES_LLM_URL:-}
      ALLIES_MODEL: ${ALLIES_MODEL:-hermes3:3b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - stars_data:/app/data
      - stars_uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"

  # Hanya server internet: reverse proxy + sertifikat HTTPS otomatis (Let's Encrypt).
  caddy:
    image: caddy:2-alpine
    profiles: ["internet"]
    restart: unless-stopped
    environment:
      STARS_DOMAIN: ${STARS_DOMAIN:?isi STARS_DOMAIN untuk profil internet}
      IMMS_DOMAIN: ${IMMS_DOMAIN:-imms.example.id}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Profil "ai" (gratis): model Hermes lewat Ollama, hanya bisa dijangkau layanan di dalam Docker.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEM:-3500m}
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama_data:/root/.ollama

  # Otomasi n8n Community; hanya terbuka di 127.0.0.1 VPS, dibuka lewat terowongan SSH.
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    profiles: ["ai"]
    restart: unless-stopped
    mem_limit: ${N8N_MEM:-700m}
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      STARS_INTEGRASI_TOKEN: ${INTEGRASI_TOKEN:-}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - app

volumes:
  ollama_data:
  n8n_data:
  stars_data:
  stars_uploads:
  caddy_data:
  caddy_config:
